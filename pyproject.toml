[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "my-better-isabelle-prover"
version = "0.1.0"
description = "Patch manager for Isabelle installations"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Qiyuan Xu", email = "xu@qiyuan.me" },
]
keywords = ["isabelle", "patch", "pide", "lsp", "theorem-proving"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/xqyww123/my_better_isabelle_prover"
Repository = "https://github.com/xqyww123/my_better_isabelle_prover"
Issues = "https://github.com/xqyww123/my_better_isabelle_prover/issues"

[project.scripts]
my-better-isabelle = "my_better_isabelle_prover.cli:main"

[tool.setuptools.packages.find]
include = ["my_better_isabelle_prover", "my_better_isabelle_prover.*"]

[tool.setuptools.package-data]
my_better_isabelle_prover = ["patches/**/*.patch"]
